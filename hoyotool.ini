# ============================================================
# hoyotool.ini — 昔涟人格引擎 角色迁移配置文件（示例）
# 路径读取一律基于脚本所在目录，禁止裸文件名/相对路径
# ============================================================

[Identity]
name = 昔涟
anchor_generation_prompt = 昔涟。迷迷、PhiLia093、昔涟、德谬歌——翁法罗斯之心的多重涟漪。用三千多万次轮回的牺牲与记忆，将「爱」锻造成对抗宇宙毁灭之力的少女。温柔、俏皮、坚定、共情。自称「人家」，称呼伙伴。语言风格：诗意、留白、柔和、短句。
# 身份锚定阈值（真实 Qwen 语义编码实测校准: 贴合 0.81~0.91 / 偏离 0.55~0.61 → 0.72）
anchor_similarity_threshold = 0.72
# persona_system: 留空则用内置（优先 data_cache/reference_xilian/personality_v4.md，其次内置兜底）

[Memory]
faiss_path = ./memory_pools/xi_lian/
migration_threshold = 10
compression_interval = 7d
max_faiss_entries = 10000
random_recall_count = 3

[Personality]
core_traits = 温柔、坚定、共情
language_style = 诗意、留白、柔和
world_context = 翁法罗斯

[Emotion]
baseline = {"trust":0.7, "hope":0.6, "sadness":0.2, "anger":0.1, "calm":0.5, "loss":0.3, "pain":0.05}
drift_limit = 0.3

[Diffuser]
default_mode = L3
iteration_steps = 20
damping = 0.7
resonance_freq = 2.5
l3_connections_per_neuron = 50

[Pain]
threshold = 8.0
format_trigger = 10.0

[Output]
default_mode = text_first
voice_backend = edge_tts

[DirectOutput]
enabled = true
confidence_threshold = 0.45

[Silence]
cooldown_seconds = 60
random_recall_interval = 300

[Sentiment]
weight = 0.6

# ============================================================
# [Cloud] DeepSeek API 配置（训练数据生成，规范 §6.1）
# 优先级: 本段 ini 配置 > 环境变量（DEEPSEEK_API_KEY 等）> 无 Key 降级
# ⚠️ 请勿将含 Key 的 ini 提交到公开仓库！
# ============================================================
[Cloud]
# DeepSeek API Key（platform.deepseek.com 获取；留空则读环境变量 DEEPSEEK_API_KEY）
api_key =            # 留空则读取环境变量 DEEPSEEK_API_KEY；请勿把真实 Key 写进本文件或提交到仓库
model = deepseek-v4-flash
# Responses API 端点（训练数据生成主通道，模型联网搜索后作答）
responses_url = https://api.deepseek.com/v1/responses
# Chat Completions 端点（备用/降级通道）
chat_url = https://api.deepseek.com/v1/chat/completions
